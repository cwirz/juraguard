.mr:
  stage: triggers
  rules:
    - if: $CI_MERGE_REQUEST_IID
  trigger:
    include: $CONTEXT/.gitlab-ci.yml
    strategy: depend

.branch:
  extends: .mr
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  trigger:
    include: $CONTEXT/.gitlab-ci.yml
    strategy: depend
