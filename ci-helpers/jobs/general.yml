workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build
  - setup
  - teardown
  - infrastructure-triggers
  - priority-triggers
  - triggers
  - tagging
  - cleanup

.mr:
  stage: triggers
  rules:
    - if: $CI_MERGE_REQUEST_IID
  trigger:
    include: $CONTEXT/.gitlab-ci.yml
    strategy: depend

.deferred-mr:
  extends: .mr
  when: always

.branch:
  extends: .mr
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  trigger:
    include: $CONTEXT/.gitlab-ci.yml
    strategy: depend
