name: Release public image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: juraguard
    env:
      DATA_DIR: /tmp/juraguard-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate release tag
        env:
          CANONICAL_RELEASE_ACTOR: ${{ vars.CANONICAL_RELEASE_ACTOR }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]
          [ -n "$CANONICAL_RELEASE_ACTOR" ]
          [ "$GITHUB_ACTOR" = "$CANONICAL_RELEASE_ACTOR" ]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: juraguard/requirements-dev.lock
      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run required checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
          ruff check .
      - name: Validate deployment scripts and Compose
        working-directory: ${{ github.workspace }}
        run: bash deploy/check.sh
      - name: Scan repository for secrets
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro"
           ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
           detect --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact
      - name: Scan dependencies for vulnerabilities
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro"
          aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
          fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /repo/juraguard
      - name: Build container for vulnerability scan
        run: docker build --platform linux/amd64 --tag juraguard-release-check:${GITHUB_SHA} .
      - name: Scan built container for vulnerabilities and licenses
        run: |
          docker save "juraguard-release-check:${GITHUB_SHA}" --output /tmp/juraguard-release-check.tar
          docker run --rm -v /tmp:/scan:ro \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image --input /scan/juraguard-release-check.tar --scanners vuln,license --severity HIGH,CRITICAL --exit-code 1

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ghcr.io/cwirz/juraguard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./juraguard
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Attest published image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/cwirz/juraguard
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
