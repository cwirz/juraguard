name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: juraguard
    env:
      DATA_DIR: /tmp/juraguard-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: juraguard/requirements-dev.lock
      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - name: Run Ruff
        run: ruff check .
      - name: Validate deployment scripts and Compose
        working-directory: ${{ github.workspace }}
        run: bash deploy/check.sh
      - name: Scan repository for secrets
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro"
           ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
           detect --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact
      - name: Scan dependencies for vulnerabilities
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro"
          aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
          fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /repo/juraguard
      - name: Build container
        run: docker build --platform linux/amd64 --tag juraguard-ci:${GITHUB_SHA} .
      - name: Scan built container for vulnerabilities and licenses
        run: |
          docker save "juraguard-ci:${GITHUB_SHA}" --output /tmp/juraguard-ci.tar
          docker run --rm -v /tmp:/scan:ro \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image --input /scan/juraguard-ci.tar --scanners vuln,license --severity HIGH,CRITICAL --exit-code 1
