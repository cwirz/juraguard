name: Bug report
description: Report a reproducible public-beta problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets or vulnerability details. Use SECURITY.md for security reports.
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and minimal reproduction steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, container runtime, database, and relevant non-secret configuration
    validations:
      required: true
